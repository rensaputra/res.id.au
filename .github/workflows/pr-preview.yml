name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Last Build Date
        run: echo "LAST_BUILD_DATE=$(TZ=Australia/Sydney date +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          BASE_URL: /pr-${{ github.event.number }}/
          LAST_BUILD_DATE: ${{ env.LAST_BUILD_DATE }}
          VISITOR_COUNTER_API_BASE_URL: ${{ vars.VISITOR_COUNTER_API_BASE_URL }}

      - name: Deploy PR Preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = `https://res.id.au/pr-${context.payload.pull_request.number}/`;

            // Find an existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const previewComment = comments.find(comment =>
              comment.body.includes('**Staging Preview URL:**')
            );

            const commentBody = `🚀 **Staging Preview URL:** [${url}](${url})\n\n_This environment gets automatically updated on new commits and will be deleted when the PR is closed or merged._`;

            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove PR Preview
        run: |
          rm -rf pr-${{ github.event.number }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: remove PR #${{ github.event.number }} preview environment" || echo "No changes to commit"
          git pull --rebase origin gh-pages
          git push origin gh-pages
