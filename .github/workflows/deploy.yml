name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      s3_only:
        description: 'Only deploy to S3 (skip GitHub Pages, IndexNow and Wayback Machine)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read
  id-token: write # Required for AWS OIDC authentication

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs are only allowed from main so a feature branch can't overwrite production.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      # true only for manual runs with "s3_only" ticked; empty on push events.
      S3_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.s3_only }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Last Build Date
        run: echo "LAST_BUILD_DATE=$(TZ=Australia/Sydney date +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          LAST_BUILD_DATE: ${{ env.LAST_BUILD_DATE }}
          VISITOR_COUNTER_API_BASE_URL: ${{ vars.VISITOR_COUNTER_API_BASE_URL }}

      - name: Generate IndexNow key file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          echo "$INDEXNOW_KEY" > "./build/$INDEXNOW_KEY.txt"
          echo "Generated IndexNow verification file."

      - name: Checkout gh-pages branch
        if: ${{ env.S3_ONLY != 'true' }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 1

      - name: Preserve PR previews and CNAME
        if: ${{ env.S3_ONLY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "gh-pages-branch" ]; then
            if ls gh-pages-branch/pr-* 1> /dev/null 2>&1; then
              echo "Found PR previews, checking which PRs are still open..."
              OPEN_PRS=$(gh pr list --state open --json number --jq '.[].number')
              for pr_dir in gh-pages-branch/pr-*; do
                pr_num=$(basename "$pr_dir" | sed 's/pr-//')
                if echo "$OPEN_PRS" | grep -q "^${pr_num}$"; then
                  echo "PR #${pr_num} is open, copying preview..."
                  cp -r "$pr_dir" ./build/
                else
                  echo "PR #${pr_num} is closed or merged, discarding preview."
                fi
              done
            else
              echo "No PR previews found."
            fi
            if [ -f "gh-pages-branch/CNAME" ]; then
              echo "Found CNAME, copying to build directory..."
              cp gh-pages-branch/CNAME ./build/
            else
              echo "No CNAME found."
            fi
            rm -rf gh-pages-branch
          else
            echo "gh-pages branch not found, skipping PR preview and CNAME preservation."
          fi

      - name: Deploy to GitHub Pages
        if: ${{ env.S3_ONLY != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true

      - name: Configure AWS credentials
        if: ${{ vars.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        if: ${{ vars.S3_BUCKET != '' }}
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          # PR previews and CNAME are GitHub Pages specific, so keep them out of S3.
          EXCLUDES=(--exclude "pr-*" --exclude "pr-*/*" --exclude "CNAME")

          # Hashed static assets: safe to cache for a long time.
          aws s3 sync ./build/assets "s3://${S3_BUCKET}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Everything else (HTML, sitemap, etc.): always revalidate.
          aws s3 sync ./build "s3://${S3_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            "${EXCLUDES[@]}" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY != '' && env.S3_ONLY != 'true' }}
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://res.id.au/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          lastmod-required: false

      - name: Archive to Wayback Machine
        if: ${{ env.S3_ONLY != 'true' }}
        continue-on-error: true
        run: |
          AUTH_HEADER=""
          if [ -n "$IA_ACCESS_KEY" ] && [ -n "$IA_SECRET_KEY" ]; then
            AUTH_HEADER="-H \"Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}\""
          fi

          eval curl -s -X POST "https://web.archive.org/save" \
            $AUTH_HEADER \
            -H \'Accept: application/json\' \
            -H \'Content-Type: application/x-www-form-urlencoded\' \
            -d "url=https://res.id.au" \
            -d "capture_outlinks=1" \
            -d "capture_screenshot=1" \
            -d "skip_first_archive=1" \
            -d "if_not_archived_within=1d" || true
