name: Deploy

on:
  push:
    branches:
      - main

# Least privilege by default; each job requests what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build site
    # Only build from main so a feature branch can't overwrite production.
    # Deploy jobs depend on this one, so they are skipped too.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Last Build Date
        run: echo "LAST_BUILD_DATE=$(TZ=Australia/Sydney date +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          LAST_BUILD_DATE: ${{ env.LAST_BUILD_DATE }}
          VISITOR_COUNTER_API_BASE_URL: ${{ vars.VISITOR_COUNTER_API_BASE_URL }}

      - name: Generate IndexNow key file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          echo "$INDEXNOW_KEY" > "./build/$INDEXNOW_KEY.txt"
          echo "Generated IndexNow verification file."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          include-hidden-files: true
          retention-days: 1

  deploy-pages:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    # Shared with pr-preview.yml: both push to the gh-pages branch, so they must
    # not run concurrently. Scoped to this job only so S3 deploys are never
    # cancelled by gh-pages contention.
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    # Records this deploy under "Deployments > dev" with a link to the Pages site.
    # Separate from the GitHub-managed "github-pages" environment.
    environment:
      name: dev
      url: https://dev.res.id.au
    permissions:
      contents: write # Push to gh-pages
      pull-requests: read # List open PRs to keep their previews
    steps:
      # Gives `gh` and the gh-pages action a repository context.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 1

      # The custom domain (CNAME) is sourced from static/CNAME at build time, so it is
      # always present in build/ and does not need to be preserved from the branch here.
      - name: Preserve PR previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "gh-pages-branch" ]; then
            if ls gh-pages-branch/pr-* 1> /dev/null 2>&1; then
              echo "Found PR previews, checking which PRs are still open..."
              OPEN_PRS=$(gh pr list --state open --json number --jq '.[].number')
              for pr_dir in gh-pages-branch/pr-*; do
                pr_num=$(basename "$pr_dir" | sed 's/pr-//')
                if echo "$OPEN_PRS" | grep -q "^${pr_num}$"; then
                  echo "PR #${pr_num} is open, copying preview..."
                  cp -r "$pr_dir" ./build/
                else
                  echo "PR #${pr_num} is closed or merged, discarding preview."
                fi
              done
            else
              echo "No PR previews found."
            fi
            rm -rf gh-pages-branch
          else
            echo "gh-pages branch not found, skipping PR preview preservation."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true

  deploy-s3:
    name: Deploy to Prod
    # Runs after both build and the Pages deploy succeed.
    needs: [build, deploy-pages]
    runs-on: ubuntu-latest
    # S3_BUCKET, AWS_REGION, AWS_ROLE_ARN, CLOUDFRONT_DISTRIBUTION_ID and S3_WEBSITE_URL
    # are environment variables of "prod".
    # Using an environment changes the OIDC subject to repo:<owner>/<repo>:environment:prod.
    # Manual approval for prod is enforced by the "Required reviewers" protection rule
    # on the "prod" environment (repo Settings > Environments), not here — GitHub keeps
    # approval rules in settings so they can't be bypassed by editing this workflow.
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        id: deploy
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_WEBSITE_URL: ${{ vars.S3_WEBSITE_URL }}
        run: |
          # Hashed static assets: safe to cache for a long time.
          aws s3 sync ./build/assets "s3://${S3_BUCKET}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Everything else (HTML, sitemap, etc.): always revalidate.
          aws s3 sync ./build "s3://${S3_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

          # Shown as the deployment link in GitHub (optional).
          echo "url=${S3_WEBSITE_URL}" >> "$GITHUB_OUTPUT"

      # Hashed assets are immutable, but HTML and other files reuse their paths,
      # so CloudFront must drop its cached copies to serve the new deploy.
      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Created invalidation $INVALIDATION_ID, waiting for it to complete..."

          # Block until the edge caches are cleared so the deployment isn't
          # marked successful while stale content is still being served.
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed."

      # IndexNow and the Wayback Machine target the production site (res.id.au),
      # so they run here after the live content and CloudFront cache are updated.
      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://res.id.au/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          lastmod-required: false

      - name: Archive to Wayback Machine
        continue-on-error: true
        run: |
          AUTH_HEADER=""
          if [ -n "$IA_ACCESS_KEY" ] && [ -n "$IA_SECRET_KEY" ]; then
            AUTH_HEADER="-H \"Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}\""
          fi

          eval curl -s -X POST "https://web.archive.org/save" \
            $AUTH_HEADER \
            -H \'Accept: application/json\' \
            -H \'Content-Type: application/x-www-form-urlencoded\' \
            -d "url=https://res.id.au" \
            -d "capture_outlinks=1" \
            -d "capture_screenshot=1" \
            -d "skip_first_archive=1" \
            -d "if_not_archived_within=1d" || true
